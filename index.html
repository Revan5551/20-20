<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>20:20</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crt" aria-hidden="true"></div>
<div class="flash" aria-hidden="true"></div>

<button id="snd" class="snd" aria-pressed="false">sound off</button>
<main>
  <h1 class="glitch" data-t="20:20">20:20</h1>
  <p class="sub">The vessel is incomplete.</p>

  <svg class="shrine" viewBox="0 0 360 380" role="img" aria-label="A shrine topped with a horned skull. A sealed finger floats in the doorway inside a ring of 20 marks.">
    <defs>
      <radialGradient id="aura" cx="50%" cy="62%" r="50%">
        <stop offset="0" stop-color="#8a0010" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="180" cy="250" rx="175" ry="150" fill="url(#aura)" class="pulse"/>
    <g fill="#000" stroke="#b0001a" stroke-width="1.6" stroke-linejoin="round">
      <path d="M60 124C120 120 155 92 180 52C205 92 240 120 300 124C240 130 212 124 180 110C148 124 120 130 60 124Z"/>
      <path d="M5 196C100 190 150 160 180 128C210 160 260 190 355 196C270 206 220 198 180 182C140 198 90 206 5 196Z"/>
      <rect x="62" y="200" width="12" height="140"/><rect x="286" y="200" width="12" height="140"/>
      <rect x="50" y="214" width="260" height="8"/>
      <rect x="40" y="340" width="280" height="10"/><rect x="28" y="350" width="304" height="10"/><rect x="16" y="360" width="328" height="10"/>
    </g>
    <g class="skull" transform="translate(0,5)" fill="#000" stroke="#d1001f" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M162 18C150 16 142 8 146 0M198 18C210 16 218 8 214 0" fill="none"/>
      <path d="M164 38c-6-4-8-12-4-19 4-7 12-10 20-10s16 3 20 10c4 7 2 15-4 19v8h-6v-4h-3v4h-14v-4h-3v4h-6z"/>
      <path class="sockets" d="M168 27a4 5 0 1 0 8 0a4 5 0 1 0-8 0M184 27a4 5 0 1 0 8 0a4 5 0 1 0-8 0M180 33l-3 5h6z" fill="#ff2a3d" stroke="none"/>
    </g>
    <path d="M100 222v8l4 4-8 4 8 4-8 4 4 4M260 222v8l4 4-8 4 8 4-8 4 4 4" fill="none" stroke="#6a0010" stroke-width="1.4"/>
    <circle cx="180" cy="281" r="45" fill="none" stroke="#5a0010" stroke-dasharray="2 5"/>
    <g id="ticks"></g>
    <use class="relic" href="#finger" x="165" y="238" width="30" height="90"/>
  </svg>

  <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-label="Fingers recovered">
    <span id="count">0 / 20</span><i><b id="bar"></b></i>
  </div>

  <div id="grid" class="grid"></div>
  <p id="readout" class="readout" aria-live="polite">Touch a relic.</p>

  <section id="final" class="final" hidden>
    <h2 class="glitch" data-t="宿儺">宿儺</h2>
    <div id="tx" class="tx"></div>
    <button id="replay" class="link" hidden>Replay the transmission</button>
  </section>
</main>

<div id="dev" class="dev" hidden>
  <b>DEV</b>
  <button id="d-all">Unlock all</button>
  <button id="d-lock">Relock</button>
  <button id="d-wipe">Wipe real progress</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="finger" viewBox="0 0 30 90">
    <path d="M14 3C19 2 23 6 23 12L24 30C25 34 23 36 24 42L25 62C25 68 23 72 24 78L21 85L17 80L14 87L10 80L6 84L6 70C7 64 5 60 6 54L6 38C7 33 5 30 6 24L7 12C7 6 10 3 14 3Z"/>
    <path d="M10 9C12 5 17 5 19 9L18 17C15 19 13 19 11 17Z M6 30q9 3 18 0M7 34q8 2 16 0M6 52q9 3 18 0M7 56q8 2 16 0M12 39l2 6-2 5M18 61l-2 6 2 5M11 66l1 5M5 71q10 4 20 0M5 75q10 4 20 0" fill="none"/>
  </symbol>
</svg>

<script src="relic.js"></script>
<script src="app.js"></script>
<script src="audio.js"></script>
</body>
</html>
